name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (leave blank for a build only)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (arm64)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Run tests without Android devices
        run: swift test --skip IntegrationTests

      - name: Build and package
        run: |
          ./scripts/build-app.sh
          app=build/AVDMenuBar.app
          lipo "$app/Contents/MacOS/AVDMenuBar" -verify_arch arm64
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" build/AVDMenuBar-macos-arm64.zip

      - name: Upload application archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: build/AVDMenuBar-macos-arm64.zip
          archive: false
          if-no-files-found: error

      - name: Create installer disk image
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        run: |
          mkdir -p build/dmg-root
          ditto build/AVDMenuBar.app build/dmg-root/AVDMenuBar.app
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname 'AVD MenuBar' -srcfolder build/dmg-root \
            -format UDZO build/AVDMenuBar-macos-arm64.dmg
          hdiutil verify build/AVDMenuBar-macos-arm64.dmg

      - name: Upload installer disk image
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: build/AVDMenuBar-macos-arm64.dmg
          archive: false
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: AVDMenuBar-macos-arm64.dmg
          path: dist

      - name: Publish release and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create --verify-tag --generate-notes --title "AVD MenuBar $RELEASE_TAG" -- "$RELEASE_TAG" dist/AVDMenuBar-macos-arm64.dmg
